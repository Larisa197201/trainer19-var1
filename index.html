<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задания 31-41 | Тренажёр от Макса</title>
  <style>
    :root {
      --bg: #f0fdf4;
      --card: #ffffff;
      --text: #064e3b;
      --muted: #4b5563;
      --accent: #059669;
      --accent2: #047857;
      --ok: #16a34a;
      --bad: #dc2626;
      --warn: #d97706;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #d1fae5, transparent 35%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    header {
      background: linear-gradient(135deg, #059669, #0f766e);
      color: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(5, 150, 105, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 32px);
    }

    .subtitle {
      margin: 0;
      opacity: 0.94;
      line-height: 1.5;
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 20px 0;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(5, 150, 105, 0.25);
    }

    .btn:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid #d0d5dd;
      box-shadow: none;
    }

    .btn.ghost:hover { background: #f9fafb; }

    .total {
      margin-left: auto;
      font-weight: 700;
      color: #065f46;
      background: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.06);
      border: 1px solid #f3f4f6;
    }

    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
    }

    .status {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
    }

    .status.ok { background: #dcfce7; color: #166534; }
    .status.bad { background: #fee2e2; color: #991b1b; }

    .sentence {
      padding: 16px 18px;
      background: #ecfdf5;
      border-radius: 14px;
      margin: 12px 0;
      font-size: 16px;
      border: 1px solid #d1fae5;
      line-height: 1.75;
    }

    .sentence .m {
      display: inline-block;
      font-weight: 800;
      color: #059669;
      padding: 0 3px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .input-row label {
      font-weight: 600;
      color: #374151;
    }

    .answer-input {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      font-size: 17px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      letter-spacing: 2px;
      background: #fff;
      color: #064e3b;
      transition: 0.15s;
    }

    .answer-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
    }

    .answer-input.correct {
      border-color: #86efac;
      background: #f0fdf4;
      color: #166534;
    }

    .answer-input.wrong {
      border-color: #fca5a5;
      background: #fef2f2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .feedback {
      margin-top: 12px;
      font-weight: 600;
      line-height: 1.5;
      font-size: 15px;
    }

    .explain {
      margin-top: 8px;
      padding: 10px 14px;
      background: #f8fafc;
      border-left: 4px solid #34d399;
      border-radius: 10px;
      color: #4b5563;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .card { padding: 16px; }
      .toolbar .total {
        width: 100%;
        margin-left: 0;
        text-align: center;
      }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Задания 31–41</h1>
      <p class="subtitle">
        Расставьте все недостающие знаки препинания: укажите все цифры, на месте которых
        в предложении должны стоять запятые. Впишите номера <b>без пробелов и запятых</b>
        в порядке возрастания, например: <b>14</b>.
      </p>
    </header>

    <div class="toolbar">
      <button class="btn" id="checkAll">Проверить всё</button>
      <button class="btn ghost" id="resetAll">Сбросить всё</button>
      <div class="total" id="total">Выполнено: 0 из 11 • Верно: 0</div>
    </div>

    <main id="tasks"></main>
  </div>

  <script>
    const tasksData = [
      {
        id: 1,
        correct: "14",
        parts: [
          "Извилистые дорожки ", ["(1)"],
          " плавные линии ", ["(2)"],
          " которых ", ["(3)"],
          " манят в глубину участка ", ["(4)"],
          " делают сад загадочным."
        ],
        explanation: "Придаточное определительное «плавные линии которых манят...» стоит внутри главного предложения и выделяется запятыми с двух сторон (1 и 4)."
      },
      {
        id: 2,
        correct: "14",
        parts: [
          "Дедушка рассказал историю ", ["(1)"],
          " фольклорный характер ", ["(2)"],
          " которой ", ["(3)"],
          " все мы инстинктивно почувствовали ", ["(4)"],
          " но которая на самом деле произошла именно с ним."
        ],
        explanation: "Запятые 1 и 4 выделяют придаточное определительное. Перед союзом «но» (цифра 4 — это конец придаточного перед «но», но запятая перед «но» не нужна, так как соединяются два придаточных). Правильный ответ: 1 и 4."
      },
      {
        id: 3,
        correct: "14",
        parts: [
          "Эстрадный блеск и элементы позирования ", ["(1)"],
          " дань ", ["(2)"],
          " которым ", ["(3)"],
          " отдавали даже Ф. Лист и Н. Паганини ", ["(4)"],
          " были органически чужды утончённой натуре Ф. Шопена."
        ],
        explanation: "Придаточное определительное «дань которым отдавали...» разрывает главное предложение, поэтому выделяется запятыми с двух сторон (1 и 4)."
      },
      {
        id: 4,
        correct: "2",
        parts: [
          "Человек может проявлять и развивать все свои способности ", ["(1)"],
          " и быть счастливым только там ", ["(2)"],
          " где он чувствует себя нужным ", ["(3)"],
          " и своим ", ["(4)"],
          " и ", ["(5)"],
          " где его искусственно не возвышают ", ["(6)"],
          " и не унижают."
        ],
        explanation: "Согласно вашим ключам, правильный ответ — только цифра 2. Запятая ставится перед первым придаточным. На месте (4) и (5) запятых нет, так как однородные придаточные соединены союзом «и»."
      },
      {
        id: 5,
        correct: "145",
        parts: [
          "Страховая сумма ", ["(1)"],
          " в пределах ", ["(2)"],
          " которой ", ["(3)"],
          " страховщик производит страховые выплаты ", ["(4)"],
          " исчисляется как разность максимальной страховой суммы и суммарной величины страховых выплат ", ["(5)"],
          " если таковые производились страховщиком в течение действия настоящего договора."
        ],
        explanation: "Запятые 1 и 4 выделяют придаточное с союзным словом «которой». Запятая 5 отделяет придаточное условия, присоединённое союзом «если»."
      },
      {
        id: 6,
        correct: "14",
        parts: [
          "Множество мыслей и чувств ", ["(1)"],
          " сущность ", ["(2)"],
          " которых ", ["(3)"],
          " Константин не мог передать окружающим ", ["(4)"],
          " набралось у него во время уединения."
        ],
        explanation: "Придаточное определительное с союзным словом «которых» выделяется запятыми (1 и 4)."
      },
      {
        id: 7,
        correct: "14",
        parts: [
          "Подчёркнуто духовному облику Ильинской ", ["(1)"],
          " в чертах ", ["(2)"],
          " которой ", ["(3)"],
          " отражалось «присутствие говорящей мысли» ", ["(4)"],
          " противопоставлен внешний портрет Пшеницыной с её «простотой» душевных движений."
        ],
        explanation: "Придаточное определительное с союзным словом «которой» разрывает главное предложение, поэтому выделяется запятыми (1 и 4)."
      },
      {
        id: 8,
        correct: "14",
        parts: [
          "Человек ", ["(1)"],
          " ум ", ["(2)"],
          " которого ", ["(3)"],
          " не может подчинить себе душу ", ["(4)"],
          " не способен ощутить полноту жизни."
        ],
        explanation: "Придаточное определительное с союзным словом «которого» выделяется запятыми (1 и 4)."
      },
      {
        id: 9,
        correct: "1",
        parts: [
          "Спортсмены активно используют аминокислоты ", ["(1)"],
          " важнейшее свойство ", ["(2)"],
          " которых ", ["(3)"],
          " обнаружено учёными сравнительно недавно."
        ],
        explanation: "Придаточное определительное стоит после главного предложения, поэтому запятая ставится только перед ним (цифра 1)."
      },
      {
        id: 10,
        correct: "14",
        parts: [
          "Жимолость ", ["(1)"],
          " плоды ", ["(2)"],
          " которой ", ["(3)"],
          " богаты витаминами и питательными веществами ", ["(4)"],
          " отличается высокой зимостойкостью."
        ],
        explanation: "Придаточное определительное «плоды которой богаты...» выделяется запятыми (1 и 4)."
      },
      {
        id: 11,
        correct: "1",
        parts: [
          "Килиманджáро – бывший вулкан ", ["(1)"],
          " кратер ", ["(2)"],
          " которого ", ["(3)"],
          " почти целиком ", ["(4)"],
          " заполнен вечными льдами и снегами."
        ],
        explanation: "Придаточное определительное с союзным словом «которого» стоит после главного предложения, поэтому запятая ставится только перед ним (цифра 1)."
      }
    ];

    const container = document.getElementById("tasks");

    tasksData.forEach((task) => {
      const card = document.createElement("section");
      card.className = "card";
      card.dataset.task = task.id;

      const sentenceHTML = task.parts.map((part) => {
        if (Array.isArray(part)) {
          return `<span class="m">${part[0]}</span>`;
        }
        return part;
      }).join("");

      card.innerHTML = `
        <div class="task-head">
          <h2>Предложение ${task.id}</h2>
          <span class="status"></span>
        </div>
        <div class="sentence">${sentenceHTML}</div>
        <div class="input-row">
          <label for="ans-${task.id}">Ваш ответ:</label>
          <input
            id="ans-${task.id}"
            class="answer-input"
            type="text"
            inputmode="numeric"
            placeholder="например, 14"
            autocomplete="off"
          >
        </div>
        <div class="actions">
          <button class="btn check">Проверить</button>
          <button class="btn ghost reset">Сбросить</button>
        </div>
        <div class="feedback"></div>
      `;

      container.appendChild(card);

      const input = card.querySelector(".answer-input");

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          checkTask(card, task);
        }
      });

      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "");
      });

      card.querySelector(".check").addEventListener("click", () => {
        checkTask(card, task);
      });

      card.querySelector(".reset").addEventListener("click", () => {
        resetTask(card, task);
      });
    });

    function normalize(str) {
      return (str || "").replace(/\s+/g, "").replace(/,/g, "");
    }

    function sortDigits(str) {
      return str.split("").sort().join("");
    }

    function checkTask(card, task) {
      const input = card.querySelector(".answer-input");
      const raw = normalize(input.value);
      const given = sortDigits(raw);
      const correct = sortDigits(task.correct);
      const isEmpty = raw.length === 0;
      const isCorrect = !isEmpty && given === correct;

      input.classList.remove("correct", "wrong");

      const status = card.querySelector(".status");
      const feedback = card.querySelector(".feedback");

      if (isEmpty) {
        status.textContent = "";
        status.className = "status";
        feedback.innerHTML = `<span style="color:var(--warn)">⚠️ Введите ответ, чтобы проверить.</span>`;
        updateTotal();
        return;
      }

      if (isCorrect) {
        input.classList.add("correct");
        status.textContent = "Верно";
        status.className = "status ok";
        feedback.innerHTML = `
          ✅ Верно! Правильный ответ: <b>${task.correct}</b>.
          <div class="explain">${task.explanation}</div>
        `;
      } else {
        input.classList.add("wrong");
        status.textContent = "Ошибка";
        status.className = "status bad";
        feedback.innerHTML = `
          ❌ Пока неверно. Вы ввели: <b>${raw || "—"}</b>.
          Правильный ответ: <b>${task.correct}</b>.
          <div class="explain">${task.explanation}</div>
        `;
      }

      updateTotal();
    }

    function resetTask(card) {
      const input = card.querySelector(".answer-input");
      input.value = "";
      input.classList.remove("correct", "wrong");

      const status = card.querySelector(".status");
      status.textContent = "";
      status.className = "status";

      card.querySelector(".feedback").textContent = "";

      updateTotal();
    }

    function updateTotal() {
      const cards = [...document.querySelectorAll(".card")];
      let done = 0;
      let ok = 0;

      cards.forEach((card) => {
        const status = card.querySelector(".status");
        if (status.textContent) {
          done++;
          if (status.classList.contains("ok")) {
            ok++;
          }
        }
      });

      document.getElementById("total").textContent =
        `Выполнено: ${done} из ${cards.length} • Верно: ${ok}`;
    }

    document.getElementById("checkAll").addEventListener("click", () => {
      tasksData.forEach((task) => {
        const card = document.querySelector(`.card[data-task="${task.id}"]`);
        const input = card.querySelector(".answer-input");
        if (normalize(input.value).length > 0) {
          checkTask(card, task);
        }
      });
    });

    document.getElementById("resetAll").addEventListener("click", () => {
      tasksData.forEach((task) => {
        const card = document.querySelector(`.card[data-task="${task.id}"]`);
        resetTask(card, task);
      });
    });
  </script>
</body>
</html>
